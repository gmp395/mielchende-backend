spring.application.name=mielchende-backend

# Spring lee el archivo .env como si fuera un archivo de propiedades
# (optional: si no existe, la aplicación arranca igualmente)
spring.config.import=optional:file:.env[.properties]

# Puerto del backend (8081 para no chocar con Goxu, que usa el 8080)
server.port=8081

# Hibernate crea y actualiza las tablas a partir de las entidades, sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las sentencias SQL que ejecuta Hibernate (útil mientras desarrollamos)
spring.jpa.show-sql=true

# Clave secreta para firmar los tokens JWT, leída del .env
jwt.secret=${JWT_SECRET}
# Duración del token en minutos (1 hora)
jwt.expiration-minutes=60

# Orígenes desde los que el navegador puede llamar a la API (el frontend en Vue).
# Si hay varios, se separan por comas
cors.allowed-origins=http://localhost:5173

# Cuenta de administrador inicial, leída del .env.
# El valor tras ":" es el valor por defecto (vacío): si no hay datos en el .env,
# la aplicación arranca igualmente y simplemente no crea la cuenta
admin.name=${ADMIN_NAME:}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}