spring.application.name=mielchende-backend

# Puerto del backend (8081 para no chocar con Goxu, que usa el 8080)
server.port=8081

# Hibernate crea y actualiza las tablas a partir de las entidades, sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las sentencias SQL que ejecuta Hibernate (útil mientras desarrollamos)
spring.jpa.show-sql=true